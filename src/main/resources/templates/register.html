<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Bus Ticket Pro - Đăng ký</title>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
          integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
</head>
<body>
<div class="container mx-auto d-flex justify-content-center align-items-center" style="min-height: 100vh;">

    <div class="col-md-6 col-lg-5">
        <div class="card shadow-lg p-4 border-0" style="border-radius: 20px;">

            <!-- Header -->
            <div class="text-center mb-4">
                <h3 class="fw-bold text-primary">🚌 Bus Ticket Pro</h3>
                <h5 class="mt-2">Đăng ký tài khoản</h5>
                <p class="text-muted small">Nhanh chóng & tiện lợi</p>
            </div>

            <!-- Form -->
            <form th:action="@{/register}" method="post" th:object="${registerForm}">

                <!-- Full Name -->
                <div class="mb-3">
                    <label for="fullName" class="form-label">Họ và tên</label>
                    <input id="fullName" type="text" class="form-control" placeholder="Nguyễn Văn A"
                           th:field="*{fullName}">
                    <p th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}" class="text-danger"></p>
                </div>

                <!-- Email -->
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input id="email" type="email" class="form-control" placeholder="example@gmail.com"
                           th:field="*{email}">
                    <p th:if="${#fields.hasErrors('email')}" th:text="${#fields.errors('email')[0]}"
                       class="text-danger"></p>
                </div>

                <!-- Phone -->
                <div class="mb-3">
                    <label for="phone" class="form-label">Số điện thoại</label>
                    <input id="phone" type="text" class="form-control" placeholder="0901234567" th:field="*{phone}">
                    <p th:if="${#fields.hasErrors('phone')}" th:text="${#fields.errors('phone')[0]}"
                       class="text-danger"></p>
                </div>

                <!-- Password -->
                <div class="mb-3 position-relative">
                    <label for="password" class="form-label">Mật khẩu</label>
                    <input type="password" class="form-control" id="password" th:field="*{password}">
                    <p th:if="${#fields.hasErrors('password')}" th:text="${#fields.errors('password')[0]}"
                       class="text-danger"></p>
                </div>

                <!-- Confirm Password -->
                <div class="mb-3">
                    <label for="confirmPassword" class="form-label">Xác nhận mật khẩu</label>
                    <input id="confirmPassword" th:field="*{confirmPassword}" type="password" class="form-control">
                    <p th:if="${#fields.hasErrors('confirmPassword')}" th:text="*{#fields.errors('confirmPassword')[0]}"
                       class="text-danger"></p>
                </div>

                <!-- Submit -->
                <div class="d-flex justify-content-center mt-3">
                    <button class="btn btn-primary" style="border-radius: 10px;">
                        Đăng ký
                    </button>
                </div>

            </form>

            <!-- Footer -->
            <div class="text-center mt-3">
                <small>Đã có tài khoản?
                    <a th:href="@{/login}" class="text-decoration-none text-primary fw-semibold">
                        Đăng nhập
                    </a>
                </small>
            </div>

        </div>
    </div>

</div>
<!-- Optional JavaScript -->
<!-- jQuery first, then Popper.js, then Bootstrap JS -->
<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
        integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
        crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"
        integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1"
        crossorigin="anonymous"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"
        integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM"
        crossorigin="anonymous"></script>
</body>
</html>
