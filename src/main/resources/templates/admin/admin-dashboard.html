<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Dashboard</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <!-- Bootstrap -->
    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body style="background:#f4f6f9;">
<div class="d-flex" style="min-height:100vh;">
    <!-- SIDEBAR -->
    <div th:replace="fragments/admin-sidebar"></div>
    <!-- MAIN -->
    <div class="flex-grow-1">
        <!-- HEADER -->
        <div th:replace="fragments/admin-header :: admin-header('Dashboard')"></div>
        <!-- CONTENT -->
        <div style="padding:25px;">
            <!-- TOP STATISTICS -->
            <div class="row">
                <!-- REVENUE -->
                <div class="col-md-3 mb-4 d-flex">
                    <div style="
                        background:white;
                        border-radius:18px;
                        padding:22px;
                        box-shadow:0 4px 15px rgba(0,0,0,0.05);
                        width:100%;
                        min-height:160px;
                        display:flex;
                        align-items:center;
                        ">
                        <div class="d-flex justify-content-between align-items-center w-100">
                            <div>
                                <div style="
                                 color:#888;
                                 font-size:14px;
                                 ">
                                    Tổng doanh thu
                                </div>
                                <h3 th:text="${#numbers.formatDecimal(revenue, 0, 'COMMA', 0, 'POINT') + ' VND'}"
                                    style="
                                 font-weight:700;
                                 margin-top:10px;
                                 font-size:28px;
                                 ">
                                </h3>
                            </div>
                            <div style="
                              min-width:55px;
                              width:55px;
                              height:55px;
                              border-radius:15px;
                              background:#28a745;
                              display:flex;
                              align-items:center;
                              justify-content:center;
                              color:white;
                              font-size:22px;
                              ">
                                <i class="fa-solid fa-money-bill-wave"></i>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- TICKETS -->
                <div class="col-md-3 mb-4 d-flex">
                    <div style="
                        background:white;
                        border-radius:18px;
                        padding:22px;
                        box-shadow:0 4px 15px rgba(0,0,0,0.05);
                        width:100%;
                        min-height:160px;
                        display:flex;
                        align-items:center;
                        ">
                        <div class="d-flex justify-content-between align-items-center w-100">
                            <div>
                                <div style="
                                 color:#888;
                                 font-size:14px;
                                 ">
                                    Vé đã bán
                                </div>
                                <h3 th:text="${#numbers.formatDecimal(totalTicketPaid, 0, 'COMMA', 0, 'POINT') + ' vé'}"
                                    style="
                                 font-weight:700;
                                 margin-top:10px;
                                 font-size:28px;
                                 ">
                                </h3>
                            </div>
                            <div style="
                              min-width:55px;
                              width:55px;
                              height:55px;
                              border-radius:15px;
                              background:#007bff;
                              display:flex;
                              align-items:center;
                              justify-content:center;
                              color:white;
                              font-size:22px;
                              ">
                                <i class="fa-solid fa-ticket"></i>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- TRIPS -->
                <div class="col-md-3 mb-4 d-flex">
                    <div style="
                        background:white;
                        border-radius:18px;
                        padding:22px;
                        box-shadow:0 4px 15px rgba(0,0,0,0.05);
                        width:100%;
                        min-height:160px;
                        display:flex;
                        align-items:center;
                        ">
                        <div class="d-flex justify-content-between align-items-center w-100">
                            <div>
                                <div style="
                                 color:#888;
                                 font-size:14px;
                                 ">
                                    Tổng chuyến xe
                                </div>
                                <h3 th:text="${#numbers.formatDecimal(totalRoutes, 0, 'COMMA', 0, 'POINT') + ' chuyến'}"
                                    style="
                                 font-weight:700;
                                 margin-top:10px;
                                 font-size:28px;
                                 ">
                                </h3>
                            </div>
                            <div style="
                              min-width:55px;
                              width:55px;
                              height:55px;
                              border-radius:15px;
                              background:#f6c23e;
                              display:flex;
                              align-items:center;
                              justify-content:center;
                              color:white;
                              font-size:22px;
                              ">
                                <i class="fa-solid fa-bus"></i>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- USERS -->
                <div class="col-md-3 mb-4 d-flex">
                    <div style="
                        background:white;
                        border-radius:18px;
                        padding:22px;
                        box-shadow:0 4px 15px rgba(0,0,0,0.05);
                        width:100%;
                        min-height:160px;
                        display:flex;
                        align-items:center;
                        ">
                        <div class="d-flex justify-content-between align-items-center w-100">
                            <div>
                                <div style="
                                 color:#888;
                                 font-size:14px;
                                 ">
                                    Người dùng
                                </div>
                                <h3 th:text="${#numbers.formatDecimal(totalUsers, 0, 'COMMA', 0 , 'POINT') + ' người'}"
                                    style="
                                 font-weight:700;
                                 margin-top:10px;
                                 font-size:28px;
                                 ">
                                </h3>
                            </div>
                            <div style="
                              min-width:55px;
                              width:55px;
                              height:55px;
                              border-radius:15px;
                              background:#dc3545;
                              display:flex;
                              align-items:center;
                              justify-content:center;
                              color:white;
                              font-size:22px;
                              ">
                                <i class="fa-solid fa-users"></i>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- TABLE + TOP ROUTES -->
            <div class="row">
                <!-- TABLE -->
                <div class="col-lg-8 mb-4">
                    <div style="
                        background:white;
                        border-radius:18px;
                        padding:25px;
                        box-shadow:0 4px 15px rgba(0,0,0,0.05);
                        ">
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <div>
                                <h5 style="font-weight:700;">
                                    Thống kê doanh thu chuyến xe
                                </h5>
                            </div>
                        </div>
                        <table class="table table-hover">
                            <thead>
                            <tr style="
                                 color:#666;
                                 font-size:14px;
                                 ">
                                <th>STT</th>
                                <th>Tuyến đường</th>
                                <th>Vé bán</th>
                                <th>Doanh thu</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="trip : ${top5Trips}">
                                <td>1</td>
                                <td>
                                    <div style="font-weight:600;">
                                        <span th:text="${trip.route.origin.name}"></span> → <span
                                            th:text="${trip.route.destination.name}"></span>
                                    </div>
                                    <small th:text="${#temporals.format(trip.startTime, 'HH:mm dd/MM/yyyy')}"
                                           class="text-muted">
                                    </small>
                                </td>
                                <td th:text="${trip.totalTicketPaid}"></td>
                                <td th:text="${#numbers.formatDecimal(trip.revenue, 0, 'COMMA', 0, 'POINT')}" style="
                                    color:#28a745;
                                    font-weight:700;
                                    ">
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
                <!-- TOP ROUTES -->
                <div class="col-lg-4 mb-4">
                    <div style="
                        background:white;
                        border-radius:18px;
                        padding:25px;
                        box-shadow:0 4px 15px rgba(0,0,0,0.05);
                        ">
                        <h5 style="
                           font-weight:700;
                           margin-bottom:30px;
                           ">
                            Top người dùng đặt vé nhiều nhất
                        </h5>
                        <!-- USER -->
                        <div th:each="u, stat : ${top5Users}" style="margin-bottom:25px;">
                            <div class="d-flex justify-content-between mb-2">
                                <div>
                                    <div th:text="${u.user.fullName}" style="
                                    font-weight:600;
                                    ">
                                    </div>
                                    <small th:text="${u.ticketCount + ' vé đã đặt'}" class="text-muted">
                                    </small>
                                </div>
                            </div>
                            <div class="progress"
                                 style="
                              height:10px;
                              border-radius:20px;
                              ">
                                <div th:data-index="${stat.index}" class="progress-bar"
                                     th:style="|width:${(u.ticketCount * 100.0) / totalTicketPaid}%|"
                                >
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<!-- JS -->
<script>
    document.querySelectorAll('.progress-bar').forEach(progress => {
        let dataIndex = progress.getAttribute("data-index");
        switch (dataIndex) {
            case "0":
                progress.classList.add("bg-primary");
                break;
            case "1":
                progress.classList.add("bg-success");
                break;
            case "2":
                progress.classList.add("bg-warning");
                break;
            case "3":
                progress.classList.add("bg-info");
                break;
            case "4":
                progress.classList.add("bg-secondary");
                break;
        }
    })
</script>
<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
</body>
</html>
