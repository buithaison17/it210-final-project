<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Title</title>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
          integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
</head>
<body>
<div class="d-flex" style="min-height:100vh; background:#eef2f7;">

    <!-- SIDEBAR -->
    <div th:replace="fragments/admin-sidebar"></div>

    <!-- MAIN -->
    <div class="flex-grow-1">

        <!-- TOPBAR -->
        <div th:replace="fragments/admin-header :: admin-header('Quản lý xe bus')"></div>

        <!-- CONTENT -->
        <div style="padding:25px;">

            <div style="background:white; padding:20px; border-radius:12px;">

                <!-- HEADER ACTION -->
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 style="margin:0;">Danh sách xe bus</h5>

                    <a th:href="@{/admin/add-bus}" class="btn btn-primary" style="border-radius:20px;">
                        + Thêm xe bus
                    </a>
                </div>

                <div th:if="${success}"
                     th:text="${success}"
                     class="text-success-emphasis bg-success"
                     style="padding:10px; border-radius:8px; text-align:center; margin-bottom:15px;">
                </div>

                <!-- TABLE -->
                <table class="table table-hover align-middle">

                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Tài xế</th>
                        <th>Công ty</th>
                        <th>Biển số xe</th>
                        <th>Tổng số ghế</th>
                        <th style="text-align:center;">Action</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="bus : ${buses}">
                        <td th:text="${bus.id}"></td>
                        <td th:text="${bus.driverName}"></td>
                        <td th:text="${bus.plateNumber}"></td>
                        <td th:text="${bus.company}"></td>
                        <td th:text="${bus.totalSeats}"></td>
                        <td style="text-align:center;">
                            <a th:href="@{/admin/add-bus(id=${bus.id})}"
                               class="btn btn-sm btn-outline-primary">Sửa</a>
                            <a th:href="@{/admin/delete-bus(id=${bus.id})}"
                               class="btn btn-sm btn-outline-danger">Xoá</a>
                        </td>
                    </tr>
                    </tbody>

                </table>
                <!-- PAGINATION -->
                <div th:if="${totalPages >= 1}" class="d-flex justify-content-end align-items-center mt-3">


                    <ul class="pagination mb-0">

                        <li class="page-item">
                            <a th:href="@{/admin/buses(currentPage=${currentPage==1?1:currentPage - 1})}"
                               class="page-link">Trang trước</a>
                        </li>

                        <li class="page-item" th:classappend="${currentPage == i ? 'active' : ''}"
                            th:each="i : ${#numbers.sequence(1, totalPages)}">
                            <a class="page-link" th:text="${i}" th:href="@{/admin/buses(currentPage=${i})}"></a>
                        </li>

                        <li class="page-item">
                            <a th:href="@{/admin/buses(currentPage=${currentPage==totalPages?totalPages:currentPage + 1})}"
                               class="page-link">Trang sau</a>
                        </li>

                    </ul>

                </div>

            </div>

        </div>

    </div>

</div>
<!-- Optional JavaScript -->
<!-- jQuery first, then Popper.js, then Bootstrap JS -->
<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
        integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
        crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"
        integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1"
        crossorigin="anonymous"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"
        integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM"
        crossorigin="anonymous"></script>
</body>
</html>
