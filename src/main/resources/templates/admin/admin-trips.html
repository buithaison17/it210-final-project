<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Title</title>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
          integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
</head>
<body>
<div class="d-flex" style="background:#eef2f7;">

    <!-- SIDEBAR -->
    <div th:replace="fragments/admin-sidebar"></div>

    <!-- MAIN -->
    <div class="flex-grow-1">

        <!-- TOPBAR -->
        <div th:replace="fragments/admin-header :: admin-header('Quản lý chuyến xe')"></div>

        <!-- CONTENT -->
        <div style="padding:25px;">

            <div style="background:white; padding:20px; border-radius:12px;">

                <!-- HEADER ACTION -->
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <form th:action="@{/admin/trips}" onsubmit="return submitForm()" method="get"
                          class="d-flex align-items-center">
                        <select name="pickUp" id="pickUp" class="form-control mr-3">
                            <option value="">Điểm đón</option>
                            <option th:each="location : ${locations}"
                                    th:value="${location.id}"
                                    th:text="${location.name}"
                                    th:selected="${location.id == pickUp}"
                            >
                            </option>
                        </select>
                        <select name="dropOff" id="dropOff" class="form-control mr-3">
                            <option value="">Điểm trả</option>
                            <option th:each="location : ${locations}"
                                    th:value="${location.id}"
                                    th:text="${location.name}"
                                    th:selected="${location.id == dropOff}"
                            >
                            </option>
                        </select>
                        <input th:value="${company}"
                               name="company"
                               type="text"
                               class="form-control mr-3"
                               style="width: 200px;"
                               placeholder="Tìm kiếm theo nhà xe">
                        <button type="submit" class="btn btn-primary" style="white-space: nowrap;">Tìm kiếm</button>
                    </form>

                    <a th:href="@{/admin/add-trip}" class="btn btn-primary" style="border-radius:20px;">
                        + Thêm chuyến xe
                    </a>
                </div>

                <div
                        th:if="${success}"
                        th:text="${success}"
                        class="text-success-emphasis bg-success"
                        style="padding:10px; border-radius:8px; text-align:center; margin-bottom:15px;">
                </div>

                <!-- ERROR MESSAGE -->
                <div th:if="${error}"
                     th:text="${error}"
                     style="background:#f8d7da; color:#842029; padding:10px; border-radius:8px; text-align:center; margin-bottom:15px;">
                </div>

                <div th:if="${trips.isEmpty()}">
                    <div th:replace="fragments/not-empty"></div>
                </div>

                <!-- TABLE -->
                <table th:if="${trips.size() > 0}" class="table table-hover align-middle">
                    <thead>
                    <tr>
                        <th>STT</th>
                        <th>Nhà xe</th>
                        <th>Tuyến đường</th>
                        <th>Giá vé</th>
                        <th>Thời gian khởi hành</th>
                        <th style="text-align:center;">Hành động</th>
                    </tr>
                    </thead>

                    <tbody>

                    <tr th:each="trip, index : ${trips}">
                        <td th:text="${index.index+1}"></td>
                        <td th:text="${trip.bus.company + '-' + trip.bus.plateNumber}"></td>
                        <td th:text="${trip.route.origin.name + ' -> ' + trip.route.destination.name}"></td>
                        <td th:text="${#numbers.formatDecimal(trip.price, 1, 'POINT', 0, 'COMMA') + ' VND'}"></td>
                        <td th:text="${#temporals.format(trip.startTime, 'HH:mm dd/MM/yyyy')}"></td>
                        <td style="text-align:center;">
                            <a th:href="@{/admin/add-trip(id=${trip.id})}"
                               class="btn btn-sm btn-outline-primary">Sửa</a>
                            <a th:href="@{/admin/delete-trip(id=${trip.id})}"
                               class="btn btn-sm btn-outline-danger">Xoá</a>
                        </td>
                    </tr>
                    </tbody>
                </table>

                <!-- PAGINATION -->
                <div th:if="${trips.size() > 0}" class="d-flex justify-content-end align-items-center mt-3">


                    <ul class="pagination mb-0">

                        <li class="page-item">
                            <a th:href="@{/admin/trips(currentPage=${currentPage -1}, pickUp=${pickUp}, dropOff=${dropOff}, company=${company})}"
                               class="page-link">Trang trước</a>
                        </li>

                        <li th:each=" i : ${#numbers.sequence(1, totalPages)}"
                            th:classappend="${currentPage == i ? 'active' : ''}"
                            class="page-item">
                            <a th:href="@{/admin/trips(currentPage=${i}, pickUp=${pickUp}, dropOff=${dropOff}, company=${company})}"
                               class="page-link" th:text="${i}"></a>
                        </li>


                        <li class="page-item">
                            <a th:href="@{/admin/trips(currentPage=${currentPage+1}, pickUp=${pickUp}, dropOff=${dropOff}, company=${company})}"
                               class="page-link">Trang sau</a>
                        </li>

                    </ul>

                </div>

            </div>

        </div>

    </div>

</div>
<script>
    function submitForm() {
        const pickUp = document.getElementById('pickUp').value;
        const dropOff = document.getElementById('dropOff').value;
        if (pickUp === dropOff && pickUp !== "" && dropOff !== "") {
            alert("Điểm đón và điểm trả không được trùng nhau")
            return false;
        }
    }
</script>
<!-- Optional JavaScript -->
<!-- jQuery first, then Popper.js, then Bootstrap JS -->
<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
        integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
        crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"
        integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1"
        crossorigin="anonymous"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"
        integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM"
        crossorigin="anonymous"></script>
</body>
</html>
