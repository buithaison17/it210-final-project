<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Title</title>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
          integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
</head>
<body>
<div class="d-flex" style="min-height:100vh; background:#eef2f7;">

    <!-- SIDEBAR USER -->
    <div th:replace="fragments/passenger-sidebar"></div>

    <!-- MAIN -->
    <div class="flex-grow-1">

        <!-- TOPBAR -->
        <div th:replace="fragments/admin-header :: admin-header('Danh sách chuyến xe')"></div>

        <!-- CONTENT -->
        <div style="padding:25px;">

            <!-- CARD -->
            <div style="background:white; padding:20px; border-radius:12px;">

                <!-- FILTER -->
                <div class="d-flex justify-content-between align-items-center mb-3">

                    <h6 style="margin:0;">Chuyến xe khả dụng</h6>

                    <input type="text"
                           class="form-control"
                           placeholder="Tìm tuyến, bến xe..."
                           style="width:250px; border-radius:20px;">

                </div>

                <!-- TABLE -->
                <table class="table table-hover align-middle">
                    <thead style="background:#f8f9fa;">
                    <tr>
                        <th>STT</th>
                        <th>Nhà xe</th>
                        <th>Tuyến đường</th>
                        <th>Khởi hành</th>
                        <th>Giá vé</th>
                        <th>Số ghế còn</th>
                        <th style="text-align:center;">Hành động</th>
                    </tr>
                    </thead>

                    <tbody>

                    <tr th:each="trip, index : ${trips}">
                        <td th:text="${index.index+1}"></td>
                        <td th:text="${trip.bus.company + ' - ' + trip.bus.plateNumber}"></td>
                        <td th:text="${trip.route.origin.name + ' - ' + trip.route.destination.name}"></td>
                        <td th:text="${#numbers.formatDecimal(trip.price, 0, 'POINT', 0, 'COMMA')+' VND'}"></td>
                        <td th:text="${#temporals.format(trip.startTime, 'HH:mm dd/MM/yyyy')}"></td>
                        <td>
                            <span class="badge bg-success" th:text="${seats[index.index] + ' ghế'}"></span>
                        </td>
                        <td style="text-align:center;">
                            <a th:href="@{/choose-seat/{id}(id=${trip.id})}" class="btn btn-sm btn-primary"
                               style="border-radius:15px;">
                                Đặt vé
                            </a>
                        </td>
                    </tr>

                    </tbody>
                </table>

                <!-- PAGINATION -->
                <div class="d-flex justify-content-end align-items-center mt-3">


                    <ul class="pagination mb-0">
                        <li class="page-item">
                            <a th:href="@{/trips(currentPage=${currentPage - 1})}" class="page-link">Trang trước</a>
                        </li>

                        <li class="page-item" th:classappend="${currentPage == i ? 'active' : ''}"
                            th:each="i : ${#numbers.sequence(1, totalPages)}">
                            <a th:href="@{/trips(currentPage=${i})}" class="page-link" th:text="${i}"></a>
                        </li>

                        <li class="page-item">
                            <a th:href="@{/trips(currentPage=${currentPage + 1})}" class="page-link">Trang sau</a>
                        </li>
                    </ul>

                </div>

            </div>

        </div>

    </div>
</div>
<!-- Optional JavaScript -->
<!-- jQuery first, then Popper.js, then Bootstrap JS -->
<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
        integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
        crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"
        integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1"
        crossorigin="anonymous"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"
        integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM"
        crossorigin="anonymous"></script>
</body>
</html>
