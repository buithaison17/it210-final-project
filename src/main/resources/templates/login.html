<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Bus Ticket Pro - Đăng nhập</title>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
          integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
</head>
<body>
<div style="height: 100vh;" class="container mx-auto d-flex justify-content-center align-items-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-lg p-4 border-0"
             style="border-radius: 20px;">
            <!-- Header -->
            <div class="text-center mb-4">
                <h3 style="font-weight:600; color:#0d6efd;">🚌 Bus Ticket Pro</h3>
                <h5 class="mt-2">Đăng nhập</h5>
                <p style="color:gray; font-size:14px;">Chào mừng bạn quay lại</p>
            </div>

            <!-- Error -->
            <div th:if="${error}"
                 th:text="${error}"
                 style="background:#f8d7da; color:#842029; padding:10px; border-radius:8px; text-align:center; margin-bottom:15px;">
            </div>

            <!-- Thông báo đăng ký thành công-->
            <div th:if="${success}"
                 th:text="${success}"
                 class="text-success-emphasis bg-success"
                 style="padding:10px; border-radius:8px; text-align:center; margin-bottom:15px;">
            </div>
            <!-- Form -->
            <form th:action="@{/login}" method="post" th:object="${loginForm}">
                <!-- Username -->
                <div style="margin-bottom:15px;">
                    <label for="email">Tài khoản</label>
                    <input type="email" name="username"
                           placeholder="Nhập email"
                           id="email"
                           th:field="*{email}"
                           style="width:100%; padding:10px; border-radius:10px; border:1px solid #ccc;">
                    <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-danger"></p>
                </div>

                <!-- Password -->
                <div style="margin-bottom:15px; position:relative;">
                    <label for="password">Mật khẩu</label>
                    <input type="password" name="password" id="password" th:field="*{password}"
                           style="width:100%; padding:10px; border-radius:10px; border:1px solid #ccc;">
                    <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="text-danger"></p>
                </div>

                <!-- Submit -->
                <div style="text-align:center; margin-top:20px;">
                    <button type="submit"
                            style="background:#0d6efd; color:white; padding:10px 25px; border:none; border-radius:10px;">
                        Đăng nhập
                    </button>
                </div>

            </form>

            <!-- Footer -->
            <div style="text-align:center; margin-top:15px;">
                <small>Chưa có tài khoản?
                    <a th:href="@{/register}" class="text-decoration-none text-primary fw-semibold">
                        Đăng ký
                    </a>
                </small>
            </div>

        </div>
    </div>

</div>
<!-- Optional JavaScript -->
<!-- jQuery first, then Popper.js, then Bootstrap JS -->
<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
        integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
        crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"
        integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1"
        crossorigin="anonymous"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"
        integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM"
        crossorigin="anonymous"></script>
</body>
</html>
